services:
  redis:
    image: redis:7.2-alpine
    container_name: llm_redis_cache
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - llm_network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: llm_inference_api
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MODEL_ID=TinyLlama/TinyLlama-1.1B-Chat-v1.0
      - MODEL_DTYPE=${MODEL_DTYPE:-auto}
      - CACHE_TTL_SECONDS=3600
      - API_KEY=${API_KEY:-}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - hf_cache:/home/appuser/.cache/huggingface
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 300s
    restart: unless-stopped
    networks:
      - llm_network

volumes:
  redis_data:
    driver: local
  hf_cache:
    driver: local

networks:
  llm_network:
    driver: bridge
